
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>Entrar | myTagx</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">

    <main class="login-container">

        <section class="login-brand">
            <div class="brand-logo">
                <span class="brand-icon">M</span>
                <span>myTagx</span>
            </div>

            <div class="brand-content">
                <span class="brand-tag">QR CODE MANAGEMENT</span>
                <h1>Tecnologia que conecta.</h1>
                <p>
                    Gerencie seus QR Codes, acompanhe acessos
                    e conecte seus clientes ao mundo digital.
                </p>
            </div>

            <div class="brand-footer">
                MYTAGX QR MANAGER
            </div>
        </section>

        <section class="login-form-section">
            <div class="login-form-wrapper">

                <div class="mobile-logo">
                    <span class="brand-icon">M</span>
                    <span>myTagx</span>
                </div>

                <span class="form-label">ÁREA ADMINISTRATIVA</span>
                <h2>Bem-vindo de volta</h2>
                <p class="form-description">
                    Entre com suas credenciais para continuar.
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div id="loginMessage" class="login-message"
                         role="alert" aria-live="polite"></div>

                    <button type="submit" id="loginButton">
                        Entrar no painel
                    </button>

                </form>

                <p class="login-security">
                    <span>●</span> Ambiente protegido
                </p>

            </div>
        </section>

    </main>

    <script src="/js/login.js"></script>
</body>
</html>
